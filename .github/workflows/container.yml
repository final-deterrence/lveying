name: Build and publish Docker image

on:
  push:
    branches:
      - release/wujiandao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lveying:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lveying:${{ github.sha }}

      - name: Notify Watchtower when configured
        env:
          WATCHTOWER_UPDATE_URL: ${{ secrets.WATCHTOWER_UPDATE_URL }}
          WATCHTOWER_HTTP_API_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lveying
        run: |
          if [ -z "$WATCHTOWER_UPDATE_URL" ] || [ -z "$WATCHTOWER_HTTP_API_TOKEN" ]; then
            echo "Watchtower notification is not configured. The server can update by polling the registry."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 20 --get \
            --data-urlencode "image=$IMAGE" \
            -H "Authorization: Bearer $WATCHTOWER_HTTP_API_TOKEN" \
            "$WATCHTOWER_UPDATE_URL"
